[package]
name = "pokeessentialsaccess-launcher"
version = "0.2.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "rustls-tls", "json"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2"
regex = "1"
dirs = "6"
rfd = "0.15"
semver = "1"
sha1 = "0.10"
self-replace = "1"
sys-locale = "0.3"
wxdragon = "0.9"

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
