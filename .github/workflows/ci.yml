name: launcher ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      
jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Initialize MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install and verify Windows build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja --yes --no-progress
          }
          cl
          cmake --version
          ninja --version

      - name: Test launcher
        run: cargo test --locked --release --verbose

      - name: Build launcher
        run: cargo build --locked --release --verbose

      - name: Prepare launcher artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = 'target/x86_64-pc-windows-msvc/release'
          $src = Join-Path $releaseDir 'pokeessentialsaccess-launcher.exe'
          $dst = 'pokeessentialsaccess-launcher.exe'
          if (-not (Test-Path $src -PathType Leaf)) {
            Write-Host "Executable files found under launcher/target:"
            if (Test-Path 'target') {
              Get-ChildItem -Path 'target' -Recurse -Filter '*.exe' -File |
                Sort-Object FullName |
                Select-Object -ExpandProperty FullName
            }
            Write-Error "missing launcher binary: $src"
          }
          Copy-Item $src $dst

      - name: Upload launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: "pokeessentialsaccess-launcher"
          path: pokeessentialsaccess-launcher.exe
          if-no-files-found: error
          retention-days: 1
